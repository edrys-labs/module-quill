<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Editor</title>
    <meta
      name="description"
      content="A collaborative rich text editor, which can upload multimedia content too.<br/>For more information visit: <a href='https://github.com/edrys-labs/module-quill' target='_blank'>https://github.com/edrys-labs/module-quill</a>"
    />
    <meta name="show-in" content="*" />
    <meta
      name="module-config"
      content="{
        'config': {
          'editorId': {
            'type': 'text',
            'hint': 'Give each Quill module in a room its own id to keep their documents apart. Leave empty for the shared default document.'
          },
          'maxImageKB': {
            'type': 'number',
            'hint': 'Largest image (in KB) that can be added; bigger ones are scaled down first. Images are stored in the shared document, so keep this small. Default: 500.'
          },
          'blockRemoteImages': {
            'type': 'boolean',
            'hint': 'Only show images uploaded into the document, not images linked from other websites (which can see who views them).'
          }
        }
      }"
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css"
      rel="stylesheet"
    />
    <!-- linked here, not imported in the inline script: Parcel drops CSS imported there -->
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css" />
    <style>
      /* Layout: status, toolbar and editor fill the frame; the editor takes
         whatever the (wrapping) toolbar leaves and scrolls inside itself. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        max-width: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .ql-toolbar {
        flex: none;
      }
      #editor-container {
        flex: 1;
        min-height: 0;
      }

      #status {
        margin: 1rem;
        opacity: 0.7;
      }
      #status.error,
      #status.notice {
        opacity: 1;
        padding-left: 0.75rem;
        border-left: 4px solid #b8384a;
      }

      /* Dark mode matches module-monaco-editor (vs-dark) instead of water.css's
         navy; everything below reads these tokens. */
      @media (prefers-color-scheme: dark) {
        :root {
          --background-body: #1e1e1e;
          --background: #2d2d2d;
          --background-alt: #252526;
          --border: #333;
          --text-main: #d4d4d4;
          --text-bright: #fff;
          --text-muted: #888;
          --form-text: #ccc;
          --button-base: #3a3a3a;
          --button-hover: #4a4a4a;
          --scrollbar-thumb: #4a4a4a;
          --scrollbar-thumb-hover: #5a5a5a;
        }
      }

      /* Quill's snow theme hard-codes light colours: map them to water.css
         tokens, which follow the light/dark preference. */
      .ql-toolbar.ql-snow {
        border: 0;
        border-bottom: 1px solid var(--border);
        font-family: inherit;
        color: var(--text-main);
      }
      .ql-container.ql-snow {
        border: 0;
      }
      .ql-snow.ql-toolbar button {
        margin: 0; /* water.css spaces buttons apart */
      }
      .ql-snow.ql-toolbar button:active {
        transform: none;
      }
      .ql-snow.ql-toolbar button:focus:not(:focus-visible) {
        box-shadow: none;
      }
      .ql-snow .ql-stroke,
      .ql-snow .ql-stroke-miter {
        stroke: currentColor;
      }
      .ql-snow .ql-fill,
      .ql-snow .ql-stroke.ql-fill {
        fill: currentColor;
      }
      .ql-snow .ql-picker {
        color: inherit;
      }
      .ql-snow.ql-toolbar
        :is(
          button:hover,
          button:focus,
          button.ql-active,
          .ql-picker-label:hover,
          .ql-picker-label.ql-active,
          .ql-picker-item:hover,
          .ql-picker-item.ql-selected
        ) {
        color: var(--links);
      }
      .ql-snow.ql-toolbar
        :is(
          button:hover,
          button:focus,
          button.ql-active,
          .ql-picker-label:hover,
          .ql-picker-label.ql-active,
          .ql-picker-item:hover,
          .ql-picker-item.ql-selected
        )
        :is(.ql-stroke, .ql-stroke-miter) {
        stroke: var(--links);
      }
      .ql-snow.ql-toolbar
        :is(
          button:hover,
          button:focus,
          button.ql-active,
          .ql-picker-label:hover,
          .ql-picker-label.ql-active,
          .ql-picker-item:hover,
          .ql-picker-item.ql-selected
        )
        .ql-fill {
        fill: var(--links);
      }
      .ql-snow .ql-picker.ql-expanded .ql-picker-label {
        color: var(--text-muted);
      }
      .ql-snow .ql-picker-options {
        background-color: var(--background-body);
      }
      .ql-toolbar.ql-snow .ql-picker.ql-expanded .ql-picker-label,
      .ql-toolbar.ql-snow .ql-picker.ql-expanded .ql-picker-options {
        border-color: var(--border);
      }
      .ql-snow .ql-tooltip {
        background-color: var(--background-body);
        border-color: var(--border);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        color: var(--text-main);
      }
      .ql-snow .ql-tooltip input[type='text'] {
        border-color: var(--border);
      }
      .ql-snow .ql-tooltip a.ql-action::after {
        border-color: var(--border);
      }
      .ql-snow a {
        color: var(--links);
      }
      .ql-editor.ql-blank::before,
      .ql-editor li[data-list] > .ql-ui {
        color: var(--text-muted);
      }
      .ql-snow .ql-editor code {
        background-color: var(--background);
      }
      .ql-snow .ql-editor blockquote {
        border-left-color: var(--border);
        font-style: normal; /* water.css italicises blockquotes, Quill does not */
      }
      .ql-editor td {
        border-color: var(--border);
      }

      .ql-cursor.ql-hidden {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
      .ql-cursor-flag {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        background: var(--cursor-color);
        position: absolute;
        z-index: 1000;
      }
      .ql-cursor-selection {
        background: rgba(var(--cursor-rgb), 0.2) !important;
        border: 2px solid var(--cursor-color) !important;
      }
      .ql-cursor-caret {
        width: 2px !important;
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        background: var(--cursor-color);
      }
    </style>
  </head>
  <body>
    <p id="status" role="status">Loading editor…</p>
    <div id="editor-container"></div>
    <script type="module">
      import Quill from 'quill'
      import QuillCursors from 'quill-cursors'
      import { QuillBinding } from 'y-quill'
      import katex from 'katex'

      // Quill's formula format looks KaTeX up on window
      window.katex = katex

      const DEFAULTS = {
        editorId: '',
        maxImageKB: 500,
        blockRemoteImages: false,
      }

      // Uploaded images are scaled to fit this box (px) unless they are already small enough
      const MAX_IMAGE_SIDE = 1280
      const JPEG_QUALITIES = [0.85, 0.7, 0.5]

      // Videos can only come from these players; everything else is blocked for every peer
      const VIDEO_URL =
        /^https:\/\/(www\.youtube\.com\/embed\/|www\.youtube-nocookie\.com\/embed\/|player\.vimeo\.com\/video\/)/

      // Config fields arrive JSON-parsed, or as a string/undefined when unset or invalid
      const asObject = (c) => (c && typeof c === 'object' ? c : {})

      function readConfig() {
        const merged = { ...DEFAULTS }
        const sources = [
          Edrys.module.config,
          Edrys.module[Edrys.role.toLowerCase() + 'Config'],
        ]
        for (const source of sources) {
          for (const [key, value] of Object.entries(asObject(source))) {
            // the settings form saves empty fields as '': keep the default then
            if (value !== '' && value !== undefined) merged[key] = value
          }
        }
        return merged
      }

      // An empty editorId keeps the original key, so existing documents stay where they are
      const stateKey = (cfg) =>
        cfg.editorId ? `quill-text-${cfg.editorId}` : 'quill-text'

      const status = document.getElementById('status')

      function showError(error) {
        console.error('Editor initialization error:', error)
        status.classList.add('error')
        status.setAttribute('role', 'alert')
        status.textContent =
          `Could not start the editor: ${error?.message || error}. ` +
          'Reload the page; if this keeps happening, check the module URL in the class settings.'
        status.hidden = false
      }

      // A short message above the toolbar that goes away by itself
      let noticeTimer
      function notify(message) {
        clearTimeout(noticeTimer)
        status.className = 'notice'
        status.setAttribute('role', 'status')
        status.textContent = message
        status.hidden = false
        noticeTimer = setTimeout(() => (status.hidden = true), 8000)
      }

      /**
       * Video embeds render peer-supplied URLs for everyone: allow only known
       * players, sandboxed. Blocked URLs show a note instead of the page.
       */
      function registerSafeVideo() {
        const Video = Quill.import('formats/video')
        class SafeVideo extends Video {
          static sanitize(url) {
            return VIDEO_URL.test(url) ? url : 'about:blank'
          }
          static create(value) {
            const node = super.create(value)
            if (node.getAttribute('src') === 'about:blank') {
              node.setAttribute('sandbox', '')
              node.setAttribute(
                'srcdoc',
                '<p style="font: 14px system-ui, sans-serif; color: #888">' +
                  'Video blocked: only YouTube and Vimeo videos can be embedded.</p>'
              )
            } else {
              node.setAttribute(
                'sandbox',
                'allow-scripts allow-same-origin allow-presentation allow-popups'
              )
            }
            return node
          }
        }
        Quill.register(SafeVideo, true)
      }

      /** With blockRemoteImages, only images stored in the document (data: URLs) are shown. */
      function registerImageFormat(cfg) {
        if (cfg.blockRemoteImages !== true) return
        const Image = Quill.import('formats/image')
        class LocalImage extends Image {
          static sanitize(url) {
            return /^data:image\//.test(url) ? url : '//:0'
          }
        }
        Quill.register(LocalImage, true)
      }

      const dataUrlBytes = (url) => Math.ceil(((url.length - url.indexOf(',') - 1) * 3) / 4)

      const readDataUrl = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onload = () => resolve(reader.result)
          reader.onerror = () => reject(reader.error)
          reader.readAsDataURL(file)
        })

      /**
       * The image as a data: URL of at most maxBytes: unchanged if it already fits
       * (keeps PNG transparency and GIF animation), otherwise scaled down to
       * MAX_IMAGE_SIDE and re-encoded as JPEG. Throws if it cannot be made to fit.
       */
      async function shrinkImage(file, maxBytes) {
        const bitmap = await createImageBitmap(file).catch(() => {
          throw new Error(`"${file.name}" could not be read as an image`)
        })
        const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(bitmap.width, bitmap.height))
        if (scale === 1 && file.size <= maxBytes) {
          bitmap.close()
          return readDataUrl(file)
        }

        const canvas = document.createElement('canvas')
        canvas.width = Math.round(bitmap.width * scale)
        canvas.height = Math.round(bitmap.height * scale)
        const context = canvas.getContext('2d')
        // JPEG has no transparency: put transparent images on white
        context.fillStyle = '#fff'
        context.fillRect(0, 0, canvas.width, canvas.height)
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height)
        bitmap.close()

        for (const quality of JPEG_QUALITIES) {
          const url = canvas.toDataURL('image/jpeg', quality)
          if (dataUrlBytes(url) <= maxBytes) return url
        }
        throw new Error(
          `"${file.name}" is too large even after scaling it down (limit ${maxBytes / 1024} KB)`
        )
      }

      /** Quill uploader handler (toolbar button, paste and drop): shrink, then insert. */
      function imageUploader(cfg) {
        const maxBytes = (Number(cfg.maxImageKB) || DEFAULTS.maxImageKB) * 1024
        return async function (range, files) {
          let index = range.index
          this.quill.deleteText(range.index, range.length, 'user')
          for (const file of files) {
            try {
              const url = await shrinkImage(file, maxBytes)
              this.quill.insertEmbed(index++, 'image', url, 'user')
            } catch (error) {
              notify(`Image not added: ${error.message}.`)
            }
          }
          this.quill.setSelection(index, 'silent')
        }
      }

      async function initializeEditor() {
        // onReady only fires inside an Edrys classroom
        const slow = setTimeout(() => {
          status.textContent =
            'Still waiting for the classroom to connect… This editor only works inside Edrys.'
        }, 10_000)

        try {
          // Wait for Edrys to be ready
          await new Promise((resolve) => Edrys.onReady(resolve))
          clearTimeout(slow)

          const cfg = readConfig()
          const STATE_KEY = stateKey(cfg)

          // Register QuillCursors module
          Quill.register('modules/cursors', QuillCursors)
          //const awareness = Edrys.getState('quill-awareness', 'Awareness')
          registerSafeVideo()
          registerImageFormat(cfg)

          const editor = new Quill('#editor-container', {
            modules: {
              uploader: {
                mimetypes: ['image/png', 'image/jpeg', 'image/gif', 'image/webp'],
                handler: imageUploader(cfg),
              },
              cursors: {
                transformOnTextChange: true,
                selectionChangeSource: null,
                hideDelayMs: 0,
                hideSpeedMs: 0,
              },
              toolbar: [
                ['bold', 'italic', 'underline', 'strike'], // toggled buttons
                ['blockquote', 'code-block'],
                ['link', 'image', 'video', 'formula'],

                [{ header: 1 }, { header: 2 }], // custom button values
                [{ list: 'ordered' }, { list: 'bullet' }, { list: 'check' }],
                [{ script: 'sub' }, { script: 'super' }], // superscript/subscript
                [{ indent: '-1' }, { indent: '+1' }], // outdent/indent
                [{ direction: 'rtl' }], // text direction

                [{ size: ['small', false, 'large', 'huge'] }], // custom dropdown
                [{ header: [1, 2, 3, 4, 5, 6, false] }],

                [{ color: [] }, { background: [] }], // dropdown with defaults from theme
                [{ font: [] }],
                [{ align: [] }],

                ['clean'], // remove formatting button
              ],
            },
            theme: 'snow',
            placeholder: 'Start collaborating...',
          })

          const cursors = editor.getModule('cursors')

          // Generate stable user information
          const userId = Math.floor(Math.random() * 10000).toString()
          const userColor = `#${Math.floor(Math.random() * 16777215).toString(
            16
          )}`
          const userName = `User-${userId}`

          // Set up awareness after editor is initialized
          /*  awareness.setLocalStateField('user', {
            name: userName,
            color: userColor,
            id: userId,
          })  */

          // getState creates the Y.Text when the key is missing. Peers that do this
          // at the same moment each create one and Yjs keeps only one, so rebind
          // whenever the key's value is replaced, or this peer edits a dropped text.
          let ytext = Edrys.getState(STATE_KEY, 'Text')
          let binding = new QuillBinding(ytext, editor)
          window.ytext = ytext

          Edrys.getState().observe((event) => {
            if (!event.keysChanged.has(STATE_KEY)) return
            const current = Edrys.getState(STATE_KEY, 'Text')
            if (current === ytext) return
            binding.destroy()
            ytext = current
            binding = new QuillBinding(ytext, editor)
            window.ytext = ytext
          })

          // Handle selection changes after binding is created
          /*  editor.on('selection-change', (range) => {
            if (range) {
              awareness.setLocalStateField('cursor', {
                index: range.index,
                length: range.length,
              })
            }
          })  */

          // Handle awareness changes
          /*  awareness.on('change', () => {
            const states = Array.from(awareness.getStates().entries())
            states.forEach(([clientId, state]) => {
              if (
                state.user &&
                state.cursor &&
                clientId !== awareness.clientID
              ) {
                try {
                  // Ensure cursor exists
                  if (!cursors.cursors[clientId]) {
                    cursors.createCursor(
                      clientId.toString(),
                      state.user.name,
                      state.user.color
                    )
                  }

                  // Move cursor safely
                  if (state.cursor.index !== undefined) {
                    cursors.moveCursor(clientId.toString(), {
                      index: state.cursor.index,
                      length: state.cursor.length || 0,
                    })
                  }
                } catch (err) {
                  console.warn('Cursor update error:', err)
                }
              }
            })
          })  */

          // Debug logging; window.editor and window.ytext are used by the e2e tests (edrys-module-tests)
          window.editor = editor
          window.cursors = cursors
          //window.awareness = awareness

          status.hidden = true
        } catch (error) {
          clearTimeout(slow)
          showError(error)
        }
      }

      initializeEditor()
    </script>
  </body>
</html>
