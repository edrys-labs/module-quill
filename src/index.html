<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Editor</title>
    <meta
      name="description"
      content="A collaborative rich text editor, which can upload multimedia content too.<br/>For more information visit: <a href='https://github.com/edrys-labs/module-quill' target='_blank'>https://github.com/edrys-labs/module-quill</a>"
    />
    <meta name="show-in" content="*" />
    <meta
      name="module-config"
      content="{
        'config': {
          'editorId': {
            'type': 'text',
            'hint': 'Give each Quill module in a room its own id to keep their documents apart. Leave empty for the shared default document.'
          },
          'synchronize': {
            'type': 'boolean',
            'hint': 'Share one document across all peers in the room, with live cursors; otherwise each person edits their own copy, kept in their browser'
          },
          'placeholder': {
            'type': 'text',
            'hint': 'Shown while the document is empty'
          },
          'toolbar': {
            'type': 'radio-button',
            'options': ['full', 'basic'],
            'hint': 'basic: text styles, headings, lists, links, images and formulas'
          },
          'maxImageKB': {
            'type': 'number',
            'hint': 'Largest image (in KB) that can be added; bigger ones are scaled down first. Images are stored in the shared document, so keep this small. Default: 500.'
          },
          'blockRemoteImages': {
            'type': 'boolean',
            'hint': 'Only show images uploaded into the document, not images linked from other websites (which can see who views them).'
          }
        },
        'studentConfig': {
          'readOnly': {
            'type': 'boolean',
            'hint': 'Students can read the shared document but not edit it (use with synchronize)'
          }
        }
      }"
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <!-- from the installed packages, so CSS and JS versions match; Parcel bundles them -->
    <!-- editor.css comes last: it overrides water.css and Quill's snow theme -->
    <link rel="stylesheet" href="../node_modules/quill/dist/quill.snow.css" />
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <p id="status" role="status">Loading editor…</p>
    <div id="editor-container"></div>
    <script type="module" src="editor.js"></script>
  </body>
</html>
